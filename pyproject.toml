[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# Pre-existing stylistic debt across the codebase; relaxed repo-wide rather than
# mechanically rewriting unfamiliar logic. Correctness rules (F, most E/B) stay on.
ignore = [
    "E501",    # line length — many long log/prompt strings predate enforcement
    "B904",    # raise ... from — not yet threaded through existing except blocks
    "SIM102",  # nested if — collapsing changes readability of existing branches
    "SIM117",  # nested with — same
]

[tool.pytest.ini_options]
addopts = "-q --maxfail=3 --disable-warnings --cov=gemini_reviewer --cov-branch --cov-report=term-missing --cov-fail-under=84"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
asyncio_mode = "auto"
