name: "Gemini AI Code Reviewer"
description: "This GitHub Action automatically reviews PRs using Google's Gemini AI model."
author: 'truongnh1992'
branding:
  icon: 'zoom-in'
  color: 'blue'

inputs:
  GITHUB_TOKEN:
    description: 'GitHub token to interact with the repository'
    required: true
  GEMINI_API_KEY:
    description: 'Google Gemini API key'
    required: true
  GEMINI_MODEL:
    description: 'Deprecated and ignored. Reviews always use the model pinned by this action (gemini-3.8-flash).'
    required: false
    deprecationMessage: 'GEMINI_MODEL is deprecated and ignored; reviews always use the model pinned by this action. Remove it from your workflow.'
  EXCLUDE:
    description: 'Comma-separated list of file patterns to exclude'
    required: false
    default: ''
  SYSTEM_PROMPT:
    description: 'Custom system prompt with rules and guidelines for code reviews'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run code review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        GEMINI_API_KEY: ${{ inputs.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ inputs.GEMINI_MODEL }}
        EXCLUDE: ${{ inputs.EXCLUDE }}
        SYSTEM_PROMPT: ${{ inputs.SYSTEM_PROMPT }}
      run: python ${{ github.action_path }}/review_code_gemini.py
